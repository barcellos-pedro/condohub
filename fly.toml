# fly.toml app configuration file generated for condohub-app on 2026-08-11T21:10:47-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'condohub-app'
primary_region = 'gru'
console_command = '/rails/bin/rails console'

[build]
[env]
DATABASE_URL = 'sqlite3:///data/production.sqlite3'
PORT = '8080'

[processes]
app = './bin/rails server'

[[mounts]]
source = 'data'
destination = '/data'

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[[http_service.checks]]
interval = '10s'
timeout = '2s'
grace_period = '5s'
method = 'GET'
path = '/up'
protocol = 'http'
tls_skip_verify = false

[http_service.checks.headers]
X-Forwarded-Proto = 'https'

[[vm]]
memory = '1gb'
cpus = 1
memory_mb = 1024
