<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" fill="none">
  <!-- White background circle -->
  <circle cx="96" cy="96" r="92" fill="white"/>
  
  <!-- Teal outer circle -->
  <circle cx="96" cy="96" r="88" fill="none" stroke="#20B2AA" stroke-width="16"/>
  
  <!-- Building structure - Left building (taller) -->
  <g fill="none" stroke="#20B2AA" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left building outline -->
    <path d="M 60 140 L 60 90 L 75 75 L 75 140 Z"/>
    
    <!-- Left building windows -->
    <rect x="65" y="95" width="6" height="8"/>
    <rect x="65" y="110" width="6" height="8"/>
    <rect x="65" y="125" width="6" height="8"/>
    
    <!-- Right building (shorter) -->
    <path d="M 90 140 L 90 100 L 115 80 L 115 140 Z"/>
    
    <!-- Right building windows -->
    <rect x="97" y="90" width="6" height="8"/>
    <rect x="97" y="105" width="6" height="8"/>
    <rect x="97" y="120" width="6" height="8"/>
    
    <rect x="108" y="90" width="6" height="8"/>
    <rect x="108" y="105" width="6" height="8"/>
    <rect x="108" y="120" width="6" height="8"/>
    
    <!-- Front building detail -->
    <path d="M 120 140 L 120 115 L 132 105 L 132 140 Z"/>
    
    <!-- Front building windows -->
    <rect x="124" y="120" width="5" height="7"/>
    <rect x="124" y="130" width="5" height="7"/>
  </g>
</svg>